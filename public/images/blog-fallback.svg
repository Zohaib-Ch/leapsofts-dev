<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050001" />
      <stop offset="50%" stop-color="#190328" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Neon Glowing Accents -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff8533" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="300" fill="#ff6b00" opacity="0.08" filter="blur(60px)" />
  <circle cx="1000" cy="500" r="350" fill="#a855f7" opacity="0.1" filter="blur(80px)" />

  <!-- Abstract Tech Vector Circuit Lines -->
  <g stroke="rgba(255, 107, 0, 0.25)" stroke-width="1.5" fill="none">
    <path d="M 100 200 L 350 200 L 450 300 L 750 300 L 850 200 L 1100 200" />
    <path d="M 150 500 L 300 500 L 420 380 L 780 380 L 900 500 L 1050 500" stroke="rgba(168, 85, 247, 0.3)" />
    <circle cx="450" cy="300" r="5" fill="#ff6b00" />
    <circle cx="750" cy="300" r="5" fill="#ff6b00" />
    <circle cx="420" cy="380" r="4" fill="#a855f7" />
    <circle cx="780" cy="380" r="4" fill="#a855f7" />
  </g>

  <!-- Central Streamlined Glass Card -->
  <rect x="350" y="212.5" width="500" height="250" rx="20" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
  
  <!-- Glowing Border Header -->
  <path d="M 350 232.5 Q 350 212.5 370 212.5 L 830 212.5 Q 850 212.5 850 232.5" fill="none" stroke="url(#orangeGlow)" stroke-width="3" />

  <!-- Brand Icon & Watermark Text -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <!-- Code / Sparkles Icon -->
    <path d="M -30 -30 L -45 -15 L -30 0 M 30 -30 L 45 -15 L 30 0" fill="none" stroke="#ff6b00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 10 -40 L -10 10" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" />

    <text y="50" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="2">
      LEAPSOFTS
    </text>
    <text y="78" fill="#ff6b00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="4">
      ENGINEERING INSIGHTS
    </text>
  </g>
</svg>
